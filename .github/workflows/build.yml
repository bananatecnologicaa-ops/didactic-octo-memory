
name: Build OverlayMod APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'OverlayMod.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extrair projeto
        run: unzip -o OverlayMod.zip

      - name: Compilar APK
        working-directory: OverlayMod
        run: gradle assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: OverlayMod-apk
          path: OverlayMod/app/build/outputs/apk/debug/app-debug.apk

